<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0a"><title>Reopen One In Him</title>
<style>body{margin:0;min-height:100svh;display:grid;place-content:center;gap:18px;box-sizing:border-box;padding:28px;background:#090a0a;color:white;font:17px/1.5 system-ui,sans-serif}main{max-width:390px}h1{font-size:28px}button,a{display:block;box-sizing:border-box;width:100%;padding:14px;border:0;border-radius:9px;background:#ff9957;color:#151a15;font:700 17px system-ui;text-align:center;text-decoration:none}p{color:#d8dcd6}a{margin-top:12px;background:#252b24;color:white}</style></head>
<body><main><h1>Reopen One In Him</h1><p>Open the latest app. This refreshes app files only; your saved lessons and notes stay on this device.</p><button id="reopen">Open latest app</button><a href="./oneinhim_learner_app.html?v=240">Open directly</a><p id="status" role="status"></p></main>
<script>
const bounded = task => Promise.race([task,new Promise(resolve=>setTimeout(resolve,1500))]);
document.getElementById('reopen').onclick=async()=>{
  document.getElementById('reopen').disabled=true;
  document.getElementById('status').textContent='Refreshing app files…';
  try {
    const scope=new URL('./',location.href).href;
    if('serviceWorker' in navigator){const regs=await bounded(navigator.serviceWorker.getRegistrations());if(Array.isArray(regs))await bounded(Promise.allSettled(regs.filter(reg=>reg.scope===scope).map(reg=>reg.unregister())));}
    if('caches' in window){const keys=await bounded(caches.keys());if(Array.isArray(keys))await bounded(Promise.allSettled(keys.filter(key=>key.startsWith('oneinhim-app-')).map(key=>caches.delete(key))));}
  } catch(error) { /* Storage restrictions do not prevent reopening. */ }
  const url=new URL('./oneinhim_learner_app.html',location.href);url.searchParams.set('v','240');url.searchParams.set('reopen',String(Date.now()));location.replace(url.href);
};
</script></body></html>
