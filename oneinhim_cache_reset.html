<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Reset ONEapp</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090a0a;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
      background: #090a0a;
    }

    main {
      width: min(100%, 390px);
      display: grid;
      gap: 18px;
      text-align: center;
    }

    img {
      width: 72px;
      height: 72px;
      margin: 0 auto 4px;
      border-radius: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 10vw, 48px);
      line-height: 0.95;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    p {
      margin: 0;
      color: rgba(255, 255, 255, 0.74);
      font-size: 16px;
      line-height: 1.45;
    }

    button,
    a {
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 0;
      padding: 0 18px;
      background: #ee7326;
      color: #fff;
      font: inherit;
      font-weight: 900;
      text-decoration: none;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18);
    }

    .secondary {
      background: rgba(255, 255, 255, 0.12);
      box-shadow: none;
    }

    #status {
      min-height: 42px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <img src="assets/oih-logo-2023-orange.png" alt="" />
    <h1>Reset ONEapp</h1>
    <p>This clears the installed app cache and reloads the latest One In Him prototype.</p>
    <button id="resetButton" type="button">Clear cache and reopen</button>
    <a class="secondary" href="oneinhim_learner_app.html?v=82">Open without reset</a>
    <p id="status" role="status">Ready.</p>
  </main>

  <script>
    const status = document.getElementById("status");
    const resetButton = document.getElementById("resetButton");

    async function resetOneInHimApp() {
      resetButton.disabled = true;
      status.textContent = "Clearing installed app cache...";
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys
            .filter((key) => key.includes("oneinhim"))
            .map((key) => caches.delete(key)));
        }
        sessionStorage.clear();
        status.textContent = "Opening the latest app...";
        window.location.replace(`oneinhim_learner_app.html?v=82&reset=${Date.now()}`);
      } catch (error) {
        status.textContent = "Reset failed. Use Safari settings to clear website data for this app, then reopen.";
        resetButton.disabled = false;
      }
    }

    resetButton.addEventListener("click", resetOneInHimApp);
    window.addEventListener("load", () => {
      if (new URLSearchParams(window.location.search).get("auto") === "1") resetOneInHimApp();
    });
  </script>
</body>
</html>
